name: Build Project Winlator APK

on:
  push:
    branches:
      - feature/helio-g100-mali-optimization
      - feature/helio-g100-performance-phase2
      - feature/helio-g100-native-overlay-execution
      - feature/maliforge-gx-stage2-runtime
      - feature/maliforge-gx-stage3-backend-integration
      - feature/maliforge-gx-stage4-real-graphics-runtime
      - feature/maliforge-gx-stage05-shader-lab
      - feature/maliforge-gx-stage06-framepacing
      - feature/maliforge-gx-stage07-performance
  pull_request:
    branches:
      - main
      - feature/maliforge-gx-stage2-runtime
      - feature/maliforge-gx-stage3-backend-integration
      - feature/maliforge-gx-stage4-real-graphics-runtime
      - feature/maliforge-gx-stage05-shader-lab
      - feature/maliforge-gx-stage06-framepacing
      - feature/maliforge-gx-stage07-performance
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - antutu
          - ludashi
          - all
      build_type:
        description: Build type (debug or release)
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  FLAVOR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.flavor || 'standard' }}
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Project Winlator with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate source structure and ARM64/Mali integration
        run: bash scripts/validate-source.sh

      - name: Install host Vulkan software-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers

      - name: Build and smoke-test MaliForge GX guest Vulkan layer
        run: bash scripts/build-maliforge-gx-layer.sh --smoke-test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: >-
          sdkmanager
          "platforms;android-34"
          "build-tools;35.0.0"
          "cmake;3.22.1"
          "ndk;29.0.14206865"

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests and lint for the selected debug flavor
        if: env.BUILD_TYPE == 'debug' && env.FLAVOR != 'all'
        shell: bash
        run: |
          set -euo pipefail
          CAP_FLAVOR="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          ./gradlew ":app:test${CAP_FLAVOR}DebugUnitTest" ":app:lint${CAP_FLAVOR}Debug" --no-daemon --stacktrace

      - name: Build APK(s)
        shell: bash
        run: |
          set -euo pipefail
          CAP_TYPE="$(echo "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
          if [ "${FLAVOR}" = "all" ]; then
            ./gradlew assemble"${CAP_TYPE}" --no-daemon --stacktrace
          else
            CAP_FLAVOR="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            ./gradlew ":app:assemble${CAP_FLAVOR}${CAP_TYPE}" --no-daemon --stacktrace
          fi

      - name: Inspect APK package metadata and native ABI payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p phase2-artifacts
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > phase2-artifacts/aapt-badging.txt
          python3 scripts/inspect-apk.py "$APK" \
            --badging phase2-artifacts/aapt-badging.txt \
            --output phase2-artifacts/apk-inspection.json
          cat phase2-artifacts/apk-inspection.json

      - name: Verify MaliForge GX guest layer is packaged as an x86_64 asset
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          mkdir -p phase4-artifacts
          python3 - "$APK" <<'PY'
          import json, struct, sys, zipfile
          apk = sys.argv[1]
          asset = "assets/maliforge-gx/libmaliforge_gx_layer_x86_64.so"
          with zipfile.ZipFile(apk) as archive:
              if asset not in archive.namelist():
                  raise SystemExit(f"Missing APK asset: {asset}")
              data = archive.read(asset)
          if len(data) < 20 or data[:4] != b"\x7fELF":
              raise SystemExit("MaliForge layer asset is not an ELF object")
          if data[4] != 2 or data[5] != 1:
              raise SystemExit("MaliForge layer asset must be ELF64 little-endian")
          machine = struct.unpack_from("<H", data, 18)[0]
          if machine != 62:
              raise SystemExit(f"Expected EM_X86_64 (62), found {machine}")
          report = {"apk": apk, "asset": asset, "elf_class": 64,
                    "endianness": "little", "machine": "x86_64", "size_bytes": len(data)}
          with open("phase4-artifacts/maliforge-layer-asset.json", "w", encoding="utf-8") as out:
              json.dump(report, out, indent=2)
          print(json.dumps(report, indent=2))
          PY

      - name: Upload APK and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: project-winlator-${{ env.FLAVOR }}-${{ env.BUILD_TYPE }}-phase7
          path: |
            app/build/outputs/apk/**/*.apk
            phase2-artifacts/*
            phase4-artifacts/*
          if-no-files-found: error
          retention-days: 14
