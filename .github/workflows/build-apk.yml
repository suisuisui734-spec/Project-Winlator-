name: Build Project Winlator APK

on:
  push:
    branches:
      - feature/helio-g100-mali-optimization
      - feature/helio-g100-performance-phase2
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: Product flavor to build
        required: true
        default: standard
        type: choice
        options:
          - standard
          - antutu
          - ludashi
          - all
      build_type:
        description: Build type (debug or release)
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  FLAVOR: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.flavor || 'standard' }}
  BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Project Winlator with native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate source structure and ARM64/Mali integration
        run: bash scripts/validate-source.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: >-
          sdkmanager
          "platforms;android-34"
          "build-tools;35.0.0"
          "cmake;3.22.1"
          "ndk;29.0.14206865"

      - name: Make Gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests and lint for the selected debug flavor
        if: env.BUILD_TYPE == 'debug' && env.FLAVOR != 'all'
        shell: bash
        run: |
          set -euo pipefail
          CAP_FLAVOR="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
          ./gradlew ":app:test${CAP_FLAVOR}DebugUnitTest" ":app:lint${CAP_FLAVOR}Debug" --no-daemon --stacktrace

      - name: Build APK(s)
        shell: bash
        run: |
          set -euo pipefail
          CAP_TYPE="$(echo "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
          if [ "${FLAVOR}" = "all" ]; then
            ./gradlew assemble"${CAP_TYPE}" --no-daemon --stacktrace
          else
            CAP_FLAVOR="$(echo "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            ./gradlew ":app:assemble${CAP_FLAVOR}${CAP_TYPE}" --no-daemon --stacktrace
          fi

      - name: Inspect APK package metadata and native ABI payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p phase2-artifacts
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > phase2-artifacts/aapt-badging.txt
          python3 scripts/inspect-apk.py "$APK" \
            --badging phase2-artifacts/aapt-badging.txt \
            --output phase2-artifacts/apk-inspection.json
          cat phase2-artifacts/apk-inspection.json

      - name: Upload APK and inspection report
        uses: actions/upload-artifact@v4
        with:
          name: project-winlator-${{ env.FLAVOR }}-${{ env.BUILD_TYPE }}-phase2
          path: |
            app/build/outputs/apk/**/*.apk
            phase2-artifacts/*
          if-no-files-found: error
          retention-days: 14
