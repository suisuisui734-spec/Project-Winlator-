name: Propose upstream Winlator Mali sync

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out Project Winlator
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream Winlator Mali source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch bionic-mali-1.2 \
            https://github.com/GunaCharanTeja/WinlatorMali.git "$RUNNER_TEMP/winlator-mali-source"

      - name: Prepare an isolated upstream proposal branch
        shell: bash
        env:
          SYNC_BRANCH: upstream-sync/${{ github.run_id }}
        run: |
          set -euo pipefail
          git switch --create "$SYNC_BRANCH"

          # Deliberately omit --delete: project-only files must not disappear
          # just because they are absent from the upstream checkout.
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/workflows/mirror-winlator.yml' \
            --exclude='/.github/workflows/build-apk.yml' \
            "$RUNNER_TEMP/winlator-mali-source/" ./

          python3 - <<'PY'
          from pathlib import Path
          import re

          readme = Path("README.md")
          if readme.exists():
              text = readme.read_text(encoding="utf-8")
              text = re.sub(r"(?m)^# .*$", "# Project Winlator", text, count=1)
              note = "> Project Winlator source tree, based on Winlator Mali (Bionic Edition).\n\n"
              if not text.startswith("# Project Winlator"):
                  text = "# Project Winlator\n\n" + text
              if note.strip() not in text:
                  text = text.replace("# Project Winlator\n", "# Project Winlator\n\n" + note, 1)
              readme.write_text(text, encoding="utf-8")

          settings = Path("settings.gradle")
          if settings.exists():
              text = settings.read_text(encoding="utf-8")
              text, count = re.subn(
                  r'rootProject\.name\s*=\s*["\'][^"\']*["\']',
                  'rootProject.name = "Project Winlator"',
                  text,
                  count=1,
              )
              if count:
                  settings.write_text(text, encoding="utf-8")
          PY

      - name: Create a reviewed upstream sync pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: upstream-sync/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Upstream source is already synchronized; no PR is needed."
            exit 0
          fi

          git commit -m "Propose upstream Winlator Mali sync"
          git push --set-upstream origin "$SYNC_BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$SYNC_BRANCH" \
            --base main \
            --title "Propose upstream Winlator Mali sync" \
            --body "Automated upstream source proposal. This branch is isolated from main so project-specific changes can be reviewed before merging. Project-only files are preserved during import; inspect changes to shared source files carefully."
